services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Bind em 127.0.0.1: publicação sem endereço vira DNAT à frente do firewall do host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready da verde quando o servidor responde - inclusive respondendo falha de
      # autenticação. -U/-d mudam o log do servidor, não o veredito.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      # A imagem sobe e derruba um servidor temporário ao inicializar o volume; sem
      # start_period um pg_isready verde precoce seria consumido pelo depends_on do passo 11.
      start_period: 10s

  redis:
    image: redis:7
    ports:
      # Bind em 127.0.0.1 pelo mesmo motivo, agravado: o Redis sobe sem requirepass.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      # A espera por Postgres e Redis é daqui, não de laço de polling no entrypoint.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      # As portas aqui são as INTERNAS - 5432 e 6379 -, nunca POSTGRES_PORT/REDIS_PORT,
      # que só valem para quem chega pelo host. Sem esta sobrescrita o container herda os
      # endereços da jornada de construção, em que localhost é o próprio container, e o
      # migrate do entrypoint falha com erro que parece de credencial ou de rede.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      # Divergência deliberada com o passo 11, que prescreve "8000:8000": publicação sem
      # endereço instala DNAT à frente do firewall do host, e o que fica exposto é um
      # formulário de senha em HTTP claro. Mesmo precedente de postgres e redis acima.
      - "127.0.0.1:8000:8000"
    # Uma réplica só, e isso é premissa da migração no entrypoint: duas instâncias migram
    # concorrentemente no boot.

volumes:
  pgdata:
  redisdata:
